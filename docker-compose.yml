# Запуск:  docker compose up -d --build
# Пароли и параметры берутся из .env (шаблон — .env.example).
services:
  postgres:
    image: postgres:15-alpine
    container_name: air_quality_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ml-service:
    build:
      context: .
      dockerfile: docker/ml.Dockerfile
    container_name: air_quality_ml
    env_file: .env
    environment:
      DB_HOST: postgres          # внутри сети compose — имя сервиса, не localhost
    ports:
      - "5001:5001"
    volumes:
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
      - ./monitoring:/app/monitoring
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  main-service:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: air_quality_main
    env_file: .env
    environment:
      DB_HOST: postgres
      ML_SERVICE_URL: http://ml-service:5001
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
